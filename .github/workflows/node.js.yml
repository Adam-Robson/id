name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Type-check, Lint, Test, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Runs the CI workflow using the Node version in
          # the .nvmrc file so that the Node version used to
          # develop locally matches the version run in CI.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generates Next's route types first, so routes are checked too.
      - name: Type-check
        run: npm run typecheck

      # npm scripts put node_modules/.bin first on PATH, so this runs the Biome
      # version pinned in package.json. `npx biome` resolved a newer Biome here
      # than the one installed, which is why CI and local disagreed.
      - name: Lint & format
        run: npm run lint:ci

      # CI is the build check for Dependabot branches, which Vercel no longer
      # previews. Reusing Next's cache keeps these runs short.
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

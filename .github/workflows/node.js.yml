name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    name: Type-check, Lint, Test, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # npm scripts put node_modules/.bin first on PATH, so this runs the Biome
      # version pinned in package.json. `npx biome` resolved a newer Biome here
      # than the one installed, which is why CI and local disagreed.
      - name: Lint & format
        run: npm run lint:ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
